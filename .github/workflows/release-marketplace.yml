name: Asset Manager Marketplace Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type RELEASE only after RELEASE_CHECKLIST.md is fully green'
        required: true
        type: string

jobs:
  release:
    if: github.event.inputs.confirm_release == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: marketplace-production
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_ENVIRONMENT: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Install public UI dependencies
        run: |
          npm --prefix static install
          npm --prefix field-static install
          npm --prefix panel-static install
          npm --prefix split-static install
          npm --prefix portal-static install
      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest
      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false
      - name: Verify Marketplace release manifest
        run: npm run verify:marketplace
      - name: Check public resolver syntax
        run: |
          node --check src/index.js
          node --check src/ticket-sync.js
          node --check src/issue-panel.js
          node --check src/device-split.js
          node --check src/portal-assets.js
      - name: Run public regression tests
        run: |
          npm --prefix static test
          npm run qa:test
      - name: Build Marketplace UIs
        run: npm run build:marketplace
      - name: Switch to Marketplace-safe manifest
        run: cp manifest.marketplace.yml manifest.yml
      - name: Remove internal-only modules
        # Forge lint checks every file in src/. The Portal+ publisher writes a project property,
        # which needs manage:jira-project; only the internal manifest declares it.
        run: rm -f src/portal-plus-publisher.js src/portal-plus-refresh.js
      - name: Forge lint Marketplace descriptor
        shell: bash
        run: |
          set +e
          output=$(forge lint 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then exit 0; fi
          # The deploy step approves MAJOR_VERSION_RULE explicitly; allow only that approval here.
          if echo "$output" | grep -q "0 errors, 0 warnings, 1 approval" && echo "$output" | grep -q "MAJOR_VERSION_RULE"; then
            echo "Forge lint only requires approval for the intentional scope/module major version change; continuing."
            exit 0
          fi
          exit "$status"
      - name: Deploy exact release candidate to Forge production
        run: forge deploy --environment "$FORGE_ENVIRONMENT" --approve MAJOR_VERSION_RULE --non-interactive
