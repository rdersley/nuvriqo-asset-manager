name: Deploy to Retail in Motion work site

# Manual only. The work site (retailinmotion.atlassian.net) runs the internal edition from its
# own Forge environment, "work-site", so merges to main (which go to the sandbox through the
# development environment) never reach it until this is run. Staging is not used because the
# Marketplace final test deploys the Marketplace edition there.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy main to retailinmotion.atlassian.net'
        required: true
        type: string

concurrency:
  group: deploy-work-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_ENVIRONMENT: work-site
      FORGE_SITE: retailinmotion.atlassian.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          for ui in static field-static panel-static split-static portal-static crew-static; do npm --prefix "$ui" install; done
      - name: Verify Marketplace-safe manifest
        run: npm run verify:marketplace
      - name: Run tests
        run: |
          npm --prefix static test
          npm run qa:test
          npm run qa:internal
      - name: Build UIs
        run: for ui in static field-static panel-static split-static portal-static crew-static; do npm --prefix "$ui" run build; done
      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest
      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false
      - name: Create the work-site Forge environment if needed
        shell: bash
        run: |
          if forge environments list --non-interactive 2>&1 | grep -qw "$FORGE_ENVIRONMENT"; then
            echo "Forge environment $FORGE_ENVIRONMENT exists."
          else
            forge environments create --environment "$FORGE_ENVIRONMENT" --non-interactive
          fi
      - name: Deploy to the work-site environment
        run: forge deploy --environment "$FORGE_ENVIRONMENT" --approve MAJOR_VERSION_RULE --non-interactive
      - name: Install or upgrade on retailinmotion.atlassian.net
        shell: bash
        run: |
          if forge install --upgrade all --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive; then
            echo "Existing work-site installation upgraded."
          else
            echo "No installation to upgrade; installing."
            forge install --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive
          fi
      - name: Record deployed commit
        run: echo "Deployed $GITHUB_SHA to $FORGE_SITE (Forge environment $FORGE_ENVIRONMENT)"
