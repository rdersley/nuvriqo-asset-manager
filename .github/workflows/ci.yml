name: Asset Manager CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push to the same PR cancels its in-flight run. Validation only: the Marketplace app is
# deployed by marketplace-final-test.yml (staging, nuvriqo.atlassian.net) and release-marketplace.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Install Asset Manager UI dependencies
        run: npm --prefix static install
      - name: Install Device field UI dependencies
        run: npm --prefix field-static install
      - name: Install Issue panel UI dependencies
        run: npm --prefix panel-static install
      - name: Install Device split UI dependencies
        run: npm --prefix split-static install
      - name: Install Customer portal UI dependencies
        run: npm --prefix portal-static install
      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest
      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false
      - name: Verify Marketplace manifest
        run: npm run verify:marketplace
      - name: Check resolver syntax
        run: |
          node --check src/index.js
          node --check src/ticket-sync.js
          node --check src/issue-panel.js
          node --check src/device-split.js
          node --check src/portal-assets.js
      - name: Run import validation tests
        run: npm --prefix static test
      - name: Run QA regression simulations
        run: npm run qa:test
      - name: Build Asset Manager UI
        run: npm --prefix static run build
      - name: Build Device field UI
        run: npm --prefix field-static run build
      - name: Build Issue panel UI
        run: npm --prefix panel-static run build
      - name: Build Device split UI
        run: npm --prefix split-static run build
      - name: Build Customer portal UI
        run: npm --prefix portal-static run build
      - name: Forge lint
        shell: bash
        run: |
          set +e
          output=$(forge lint 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if echo "$output" | grep -q "0 errors, 0 warnings, 1 approval" && echo "$output" | grep -q "MAJOR_VERSION_RULE"; then
            echo "Forge lint only requires approval for the intentional scope/module major version change; continuing CI."
            exit 0
          fi
          exit "$status"
