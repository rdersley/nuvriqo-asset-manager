name: Asset Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Install Asset Manager UI dependencies
        run: npm --prefix static install
      - name: Install Device field UI dependencies
        run: npm --prefix field-static install
      - name: Install Issue panel UI dependencies
        run: npm --prefix panel-static install
      - name: Install Device split UI dependencies
        run: npm --prefix split-static install
      - name: Install Customer portal UI dependencies
        run: npm --prefix portal-static install
      - name: Install Reports UI dependencies
        run: npm --prefix reports-static install
      - name: Install Internal Asset Operations UI dependencies
        run: npm --prefix crew-static install
      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest
      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false
      - name: Prepare Device Fault backend mapping
        run: node scripts/prepare-device-fault.mjs
      - name: Prepare SD Client asset mapping
        run: node scripts/prepare-sd-client.mjs
      - name: Tighten Jira Device ID validation
        run: node scripts/prepare-device-id-validation.mjs
      - name: Prepare bulk Jira import cleanup
        run: node scripts/prepare-bulk-cleanup.mjs
      - name: Prepare CSV import reconciliation
        run: node scripts/prepare-import-reconciliation.mjs
      - name: Prepare internal crew-to-JSM customer linking
        run: node scripts/prepare-crew-customer-link.mjs
      - name: Apply scale safety guards
        run: node scripts/prepare-scale-guards.mjs
      - name: Verify Marketplace-safe manifest
        run: npm run verify:marketplace
      - name: Check resolver syntax
        run: |
          node --check src/index.js
          node --check src/ticket-sync.js
          node --check src/issue-panel.js
          node --check src/device-split.js
          node --check src/portal-assets.js
          node --check src/reports.js
          node --check src/crew.js
      - name: Run import validation tests
        run: npm --prefix static test
      - name: Run QA regression simulations
        run: npm run qa:test
      - name: Build Asset Manager UI
        run: npm --prefix static run build
      - name: Build Device field UI
        run: npm --prefix field-static run build
      - name: Build Issue panel UI
        run: npm --prefix panel-static run build
      - name: Build Device split UI
        run: npm --prefix split-static run build
      - name: Build Customer portal UI
        run: npm --prefix portal-static run build
      - name: Build Reports UI
        run: npm --prefix reports-static run build
      - name: Build Internal Asset Operations UI
        run: npm --prefix crew-static run build
      - name: Forge lint
        shell: bash
        run: |
          set +e
          output=$(forge lint 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if echo "$output" | grep -q "0 errors, 0 warnings, 1 approval" && echo "$output" | grep -q "MAJOR_VERSION_RULE"; then
            echo "Forge lint only requires approval for the intentional scope/module major version change; continuing CI."
            exit 0
          fi
          exit "$status"

  sandbox-readonly-qa:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: retailinmotion-sandbox1.atlassian.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live Jira read-only smoke tests
        run: node qa/live-jira-smoke.mjs

  deploy-sandbox:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs:
      - validate
      - sandbox-readonly-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: retailinmotion-sandbox1
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: retailinmotion-sandbox1.atlassian.net
      FORGE_ENVIRONMENT: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Install Asset Manager UI dependencies
        run: npm --prefix static install
      - name: Install Device field UI dependencies
        run: npm --prefix field-static install
      - name: Install Issue panel UI dependencies
        run: npm --prefix panel-static install
      - name: Install Device split UI dependencies
        run: npm --prefix split-static install
      - name: Install Customer portal UI dependencies
        run: npm --prefix portal-static install
      - name: Install Reports UI dependencies
        run: npm --prefix reports-static install
      - name: Install Internal Asset Operations UI dependencies
        run: npm --prefix crew-static install
      - name: Prepare Device Fault backend mapping
        run: node scripts/prepare-device-fault.mjs
      - name: Prepare SD Client asset mapping
        run: node scripts/prepare-sd-client.mjs
      - name: Tighten Jira Device ID validation
        run: node scripts/prepare-device-id-validation.mjs
      - name: Prepare bulk Jira import cleanup
        run: node scripts/prepare-bulk-cleanup.mjs
      - name: Prepare CSV import reconciliation
        run: node scripts/prepare-import-reconciliation.mjs
      - name: Prepare internal crew-to-JSM customer linking
        run: node scripts/prepare-crew-customer-link.mjs
      - name: Apply scale safety guards
        run: node scripts/prepare-scale-guards.mjs
      - name: Verify Marketplace-safe manifest
        run: npm run verify:marketplace
      - name: Build Asset Manager UI
        run: npm --prefix static run build
      - name: Build Device field UI
        run: npm --prefix field-static run build
      - name: Build Issue panel UI
        run: npm --prefix panel-static run build
      - name: Build Device split UI
        run: npm --prefix split-static run build
      - name: Build Customer portal UI
        run: npm --prefix portal-static run build
      - name: Build Reports UI
        run: npm --prefix reports-static run build
      - name: Build Internal Asset Operations UI
        run: npm --prefix crew-static run build
      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest
      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false
      - name: Deploy to Forge development
        run: forge deploy --environment "$FORGE_ENVIRONMENT" --approve MAJOR_VERSION_RULE --non-interactive
      - name: Install or upgrade on Retail in Motion sandbox
        shell: bash
        run: |
          if forge install --upgrade all --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive; then
            echo "Existing sandbox installation upgraded successfully."
          else
            echo "No upgradeable installation found; attempting first install."
            forge install --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive
          fi
      - name: Post-deploy Jira smoke tests
        run: node qa/live-jira-smoke.mjs

  browser-e2e-sandbox:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: retailinmotion-sandbox1
    env:
      ASSET_MANAGER_E2E_URL: https://retailinmotion-sandbox1.atlassian.net/jira/apps/ffd70422-97fd-49bb-83ed-0dc607590642/07cd1c66-3b03-4688-9b9b-a50402988671
      PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser QA configuration notice
        if: env.PLAYWRIGHT_STORAGE_STATE_B64 == ''
        run: echo "::warning::Authenticated browser QA is ready but PLAYWRIGHT_STORAGE_STATE_B64 is not configured yet."
      - name: Install browser QA dependencies
        if: env.PLAYWRIGHT_STORAGE_STATE_B64 != ''
        run: npm install --ignore-scripts
      - name: Install Chromium
        if: env.PLAYWRIGHT_STORAGE_STATE_B64 != ''
        run: npx playwright install --with-deps chromium
      - name: Restore Atlassian browser session
        if: env.PLAYWRIGHT_STORAGE_STATE_B64 != ''
        run: node qa/write-playwright-state.mjs
      - name: Run sandbox browser acceptance
        if: env.PLAYWRIGHT_STORAGE_STATE_B64 != ''
        run: npm run qa:browser
      - name: Upload browser failure evidence
        if: failure() && env.PLAYWRIGHT_STORAGE_STATE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: asset-manager-browser-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
