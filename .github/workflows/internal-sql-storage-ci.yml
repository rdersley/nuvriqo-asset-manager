name: Internal SQL Storage Migration CI

on:
  push:
    branches: [internal-sql-storage-migration]
  workflow_dispatch:

jobs:
  validate-internal-sql-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install --ignore-scripts

      - name: Check SQL foundation syntax
        run: |
          node --check src/sql-schema.js
          node --check src/sql-storage.js
          node --check src/sql-migration.js
          node --check src/crew.js
          node --check src/index.js

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Disable Forge usage analytics
        run: forge settings set usage-analytics false

      - name: Forge lint
        shell: bash
        run: |
          set +e
          output=$(forge lint 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -q "MAJOR_VERSION_RULE"; then
            echo "SQL module intentionally causes a major version approval; lint result accepted for migration branch."
            exit 0
          fi
          exit "$status"
