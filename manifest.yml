modules:
  jira:globalPage:
    - key: nuvriqo-asset-manager
      resource: main
      resolver:
        function: resolver
      title: Asset Manager
      layout: blank

  jira:issuePanel:
    - key: nuvriqo-asset-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      title: Device / Asset
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:customField:
    - key: nuvriqo-device-field
      name: Device
      description: Select a device from Nuvriqo Asset Manager.
      type: object
      resolver:
        function: ticket-sync
      schema:
        type: object
        properties:
          id:
            type: string
            searchAlias: AssetId
          name:
            type: string
            searchAlias: DeviceName
        required:
          - id
          - name
        additionalProperties: false
      view:
        formatter:
          expression: "value != null ? value.name : ''"
          export: true
      edit:
        resource: device-field
        experience:
          - issue-view
          - issue-create
          - issue-transition

  function:
    - key: resolver
      handler: index.handler
    - key: ticket-sync
      handler: ticket-sync.handler

resources:
  - key: main
    path: static/dist
  - key: issue-panel
    path: static/dist
  - key: device-field
    path: field-static/dist

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:user:jira
    - read:avatar:jira
    - read:application-role:jira
    - read:group:jira

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/ffd70422-97fd-49bb-83ed-0dc607590642
